<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#FAF9F5" stroke="#E7E3D8" stroke-width="3"/>

  <!-- 3x3 课表格块 -->
  <!-- Row 1 -->
  <rect x="26" y="28" width="18" height="16" rx="2.5" fill="#141413"/>
  <rect x="48" y="28" width="24" height="16" rx="2.5" fill="#E7E3D8"/>
  <rect x="76" y="28" width="18" height="16" rx="2.5" fill="#3D3B36"/>

  <!-- Row 2 -->
  <rect x="26" y="48" width="18" height="16" rx="2.5" fill="#85806F"/>
  <rect x="48" y="48" width="24" height="16" rx="2.5" fill="#D97757"/>
  <rect x="76" y="48" width="18" height="16" rx="2.5" fill="#85806F"/>

  <!-- Row 3 -->
  <rect x="26" y="68" width="18" height="16" rx="2.5" fill="#3D3B36"/>
  <rect x="48" y="68" width="24" height="16" rx="2.5" fill="#141413"/>
  <rect x="76" y="68" width="18" height="16" rx="2.5" fill="#E7E3D8"/>

  <!-- 垂直时间切线 (贯穿中列课表) -->
  <line x1="60" y1="20" x2="60" y2="92" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="20" r="3.5" fill="#D97757"/>
</svg>