<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#FAF9F5" stroke="#E7E3D8" stroke-width="3"/>
  
  <!-- 象限1 (左上): 成绩条迷你排布 (GradeStrip) -->
  <rect x="26" y="28" width="30" height="10" rx="2.5" fill="#141413"/>
  <rect x="26" y="42" width="30" height="12" rx="2.5" fill="#E7E3D8"/>
  <rect x="28" y="44" width="18" height="8" rx="2" fill="#3D3B36"/>
  
  <!-- 象限2 (右上): 图片工具/九宫格 (Image Tools) -->
  <rect x="64" y="28" width="30" height="26" rx="3" fill="#3D3B36"/>
  <rect x="69" y="33" width="8" height="8" rx="1.5" fill="#FAF9F5"/>
  <rect x="81" y="33" width="8" height="8" rx="1.5" fill="#D97757"/>
  <rect x="69" y="45" width="8" height="8" rx="1.5" fill="#85806F"/>
  <rect x="81" y="45" width="8" height="8" rx="1.5" fill="#FAF9F5"/>

  <!-- 象限3 (左下): 格式工厂/文档折页 (File & PDF) -->
  <rect x="26" y="62" width="30" height="28" rx="3" fill="#85806F"/>
  <rect x="31" y="68" width="20" height="4" rx="1.5" fill="#FAF9F5"/>
  <rect x="31" y="76" width="14" height="4" rx="1.5" fill="#FAF9F5"/>

  <!-- 象限4 (右下): 标尺与滑块工具 (Desk Utility) -->
  <rect x="64" y="62" width="30" height="28" rx="3" fill="#E7E3D8"/>
  <rect x="68" y="70" width="22" height="12" rx="2" fill="#141413"/>

  <!-- 贯穿中央轴的陶土标尺线 (带圆点指针) -->
  <line x1="60" y1="20" x2="60" y2="98" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="20" r="3.5" fill="#D97757"/>
</svg>