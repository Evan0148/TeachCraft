<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#FAF9F5" stroke="#E7E3D8" stroke-width="3"/>
  
  <!-- 左旁「彳」: 双段式竖向墨色导轨 -->
  <rect x="26" y="32" width="10" height="16" rx="3" fill="#141413"/>
  <rect x="26" y="54" width="10" height="34" rx="3" fill="#3D3B36"/>

  <!-- 右侧上方横梁 -->
  <rect x="42" y="32" width="52" height="10" rx="3" fill="#141413"/>

  <!-- 中部：双层数据格块 (微观切片) -->
  <rect x="42" y="48" width="52" height="14" rx="3" fill="#E7E3D8"/>
  <rect x="44" y="50" width="24" height="10" rx="2" fill="#85806F"/>
  <rect x="72" y="50" width="20" height="10" rx="2" fill="#3D3B36"/>

  <!-- 右下「攵」形折线与底座 -->
  <rect x="42" y="68" width="24" height="18" rx="3" fill="#85806F"/>
  <rect x="70" y="68" width="24" height="18" rx="3" fill="#141413"/>

  <!-- 贯穿微观的核心朱红光标线 -->
  <line x1="68" y1="24" x2="68" y2="94" stroke="#D97757" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="68" cy="24" r="3.5" fill="#D97757"/>
</svg>